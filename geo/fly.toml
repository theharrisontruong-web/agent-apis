# Fly.io deployment for the GEO Readiness Audit.
# One-command deploy:  fly launch  (first time)  /  fly deploy  (updates)
#
# Set secrets once (never in this file):
#   fly secrets set X402_WALLET=0xYourWallet \
#     X402_PRICE='$1.50' X402_NETWORK=eip155:8453 \
#     X402_FACILITATOR_URL=https://x402.org/facilitator
#
# Portfolio note: this can share one Fly app/box with the other agent-API
# tools (grader, etc.) — marginal infra cost per new tool is ~$0.

app = "geo-readiness-audit"
primary_region = "mia"   # Miami — close to the operator

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  X402_PRICE = "$1.50"
  X402_NETWORK = "eip155:84532"
  X402_FACILITATOR_URL = "https://x402.org/facilitator"
  X402_DISABLED = "0"
  LITE_RATE_LIMIT = "20"
  # X402_WALLET must be set via `fly secrets set` (see top of file).
